[graph]
all-features = true

[advisories]
ignore = [
    # `atty` is reachable only through the dudect development benchmark.
    # It is never linked into the published library; no fixed release exists.
    "RUSTSEC-2021-0145",
]
# Fail on unmaintained crates we select directly. The dudect-only development
# harness currently carries transitive Clap 2 support crates that are not
# linked into the published library.
unmaintained = "workspace"

[licenses]
allow = ["Apache-2.0", "BSD-3-Clause", "MIT"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "simplest-path"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
