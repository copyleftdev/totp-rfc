name: Publish

on:
  release:
    types: [published]

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crates-io:
    name: Publish to crates.io
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Fetch locked dependencies
        run: cargo +stable fetch --locked

      - name: Verify tag and package version match
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: ./scripts/release-check.sh "$RELEASE_TAG"

      - name: Publish immutable crate version
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo +stable publish --locked
