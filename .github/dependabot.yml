version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # Criterion 0.8 requires Rust 1.86; preserve the crate's Rust 1.85 MSRV.
      - dependency-name: criterion
        versions:
          - ">= 0.8"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
