name: Feature request
description: Propose a focused improvement to the RFC primitive layer.
title: "feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete interoperability, safety, or usability problem needs solving?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      description: Explain the smallest primitive-level change that addresses the problem.
    validations:
      required: true
  - type: input
    id: specification
    attributes:
      label: Specification reference
      description: Link the relevant RFC section or another authoritative source, if applicable.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Could this live in an integration crate or application layer instead?
